name: diag-gate
on:
  push:
    branches: [diag/gate-main]
permissions:
  contents: read

jobs:
  instrumented:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      os: '["windows-latest"]'
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      timeout-minutes: 120
      tools: ""
      packages: ""
      command: |
        echo "=== standalone repro inside the gate"
        (cd diag-repro && cargo run --quiet 2>&1 | head -30)
        T=originals::tests::a_hard_link_whose_identity_cannot_be_read_is_refused
        echo "=== instrumented LightCraft test"
        LC_DIAG_SAME_FILE=1 cargo test -p lightcraft-engine --lib -- $T --exact --nocapture 2>&1 | grep -E "DIAG|test result|is the original|cannot tell|panicked" || true
