name: diag-flake
on:
  push:
    branches: [diag/windows-hardlink]
    paths: [.github/workflows/diag-flake.yml]
jobs:
  flake:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      RUST_TEST_THREADS: "4"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with: { repository: THEtheChad/lightcraft, ref: dc73e0845e686153f6c5a6654b08dde6e17dae12, path: lc }
      - name: Build
        working-directory: lc
        shell: pwsh
        run: |
          cargo test -p lightcraft-engine --lib --no-run --message-format=json-render-diagnostics | Out-File -Encoding utf8 ..\a.json
          $exe = Get-Content ..\a.json | % { try { $_ | ConvertFrom-Json } catch {} } | ? { $_.reason -eq "compiler-artifact" -and $_.profile.test -and $_.target.name -eq "lightcraft_engine" } | Select -Last 1 -Expand executable
          "ENGINE_EXE=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: full suite x6, failures in full
        working-directory: lc/crates/engine
        continue-on-error: true
        shell: pwsh
        run: |
          1..6 | % {
            "=== full run $_"
            $out = & $env:ENGINE_EXE 2>&1 | Out-String
            $i = $out.IndexOf("failures:")
            if ($i -ge 0) { $out.Substring($i) } else { ($out -split "`n" | Select-String "test result").Line }
          }
