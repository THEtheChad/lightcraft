name: diag-hardlink
on:
  push:
    branches: [diag/windows-hardlink]
    paths: [.github/workflows/diag-hardlink.yml]
jobs:
  shells:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build repro
        working-directory: repro
        run: cargo build --quiet
      - name: From pwsh
        shell: pwsh
        working-directory: repro
        run: |
          whoami /priv | Select-String "SeBackupPrivilege|SeRestorePrivilege"
          .\target\debug\lc-hardlink-repro.exe | Select-String "base: C|ids\(original\)  |strict_same\(orig"
      - name: From Git Bash
        shell: bash
        working-directory: repro
        run: |
          MSYS_NO_PATHCONV=1 /c/Windows/System32/whoami.exe /priv | grep -E "SeBackupPrivilege|SeRestorePrivilege" || true
          ./target/debug/lc-hardlink-repro.exe | grep -E "base: C|ids\(original\)  |strict_same\(orig" | head -3
      - name: From cmd
        shell: cmd
        working-directory: repro
        run: |
          whoami /priv | findstr /C:"SeBackupPrivilege" /C:"SeRestorePrivilege"
          target\debug\lc-hardlink-repro.exe | findstr /C:"base: C" /C:"ids(original)  " /C:"strict_same(orig"
