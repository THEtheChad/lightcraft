name: diag-hardlink
on:
  push:
    branches: [diag/windows-hardlink]
  workflow_dispatch:
jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Environment
        shell: pwsh
        run: |
          [Environment]::OSVersion.VersionString
          (Get-CimInstance Win32_OperatingSystem | Select Caption, Version, BuildNumber | Format-List | Out-String).Trim()
          "TEMP=$env:TEMP  RUNNER_TEMP=$env:RUNNER_TEMP  GITHUB_WORKSPACE=$env:GITHUB_WORKSPACE"
          foreach ($p in @($env:TEMP, $env:RUNNER_TEMP, $env:GITHUB_WORKSPACE)) {
            $q = (Resolve-Path $p).Path.Substring(0,1)
            "--- $p (drive $q)"
            Get-Volume -DriveLetter $q | Select DriveLetter, FileSystem, FileSystemLabel, DriveType | Format-List | Out-String
            fsutil fsinfo volumeinfo "$($q):" | Select-String "File System Name|Dev Drive|ReFS|Volume Name"
          }
          fsutil devdrv query 2>&1
          whoami
          whoami /priv
          rustc -V
      - name: Repro
        working-directory: repro
        run: cargo run --quiet
